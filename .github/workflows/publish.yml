name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uvx --from hatchling hatchling version 2>/dev/null \
            || grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match project version $version" >&2
            exit 1
          fi

      - name: Build distributions
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI verifies this workflow's OIDC identity, so there is no
    # API token anywhere. Configure the publisher on PyPI to match repository,
    # workflow filename and environment exactly.
    environment:
      name: pypi
      url: https://pypi.org/p/finder-adjust-thumbnails
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
