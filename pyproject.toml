[project]
name = "finder-adjust-thumbnails"
version = "0.1.1"
description = "Set macOS Finder video thumbnails to a frame at a chosen offset"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "doronz88", email = "doron88@gmail.com" }]
keywords = ["macos", "finder", "thumbnail", "icon", "video", "quicklook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-avfoundation>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
]

[project.urls]
Homepage = "https://github.com/doronz88/finder-adjust-thumbnails"
Repository = "https://github.com/doronz88/finder-adjust-thumbnails"
Issues = "https://github.com/doronz88/finder-adjust-thumbnails/issues"

[project.scripts]
finder-adjust-thumbnails = "finder_adjust_thumbnails.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finder_adjust_thumbnails"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# See the note in _avfoundation.py: the untyped CGImage pointer is expected.
filterwarnings = ["ignore::objc.ObjCPointerWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
